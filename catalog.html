<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12101a"><title>Picture Drawer · 手机图库</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#12101a;color:#fff8f0}*{box-sizing:border-box}body{margin:0;padding:18px 14px 50px;max-width:900px;margin:auto}a{color:#ffb0ca}h1{font-size:21px;margin:0 0 4px}small,.hint{color:#b9afc1}.toolbar{position:sticky;top:0;z-index:2;background:#12101af0;padding:14px 0;display:grid;gap:9px}input,select,button{min-height:44px;border:1px solid #5c5267;border-radius:9px;background:#282234;color:#fff;padding:10px;font-size:15px;width:100%}button{background:#ef92b2;color:#1b1220;font-weight:700;cursor:pointer}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{overflow:hidden;border:1px solid #40384c;border-radius:12px;background:#221d2c}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;display:block}.meta{padding:9px;line-height:1.55;overflow-wrap:anywhere}.name{font-size:14px;font-weight:700}.tags{font-size:12px;color:#cabdce}.empty{color:#c7bdcb;padding:30px 0;text-align:center}#preview{position:fixed;inset:0;z-index:5;background:#08070de8;display:none;align-items:center;justify-content:center;flex-direction:column;padding:15px}#preview img{max-height:75vh;max-width:100%;object-fit:contain}#preview button{max-width:280px;margin-top:16px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body><h1>PICTURE DRAWER / 商品图库</h1><p class="hint">手机查看 Excel 商品清单 · <a href="./">返回原有记录工具</a></p>
<div class="toolbar"><input id="q" type="search" placeholder="搜索名称 / SKU / 档口 / 备注" aria-label="搜索商品">
<div class="row"><select id="category"><option value="">全部分类</option></select><select id="stall"><option value="">全部档口</option></select></div>
<div class="row"><button id="openFile">从本机导入 Excel</button><button id="refresh">刷新云端图库</button></div>
<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
<div class="row"><button id="export">导出 JSON（供 AI 发布）</button><button id="clear" style="background:#3b3349;color:#fff">清除本机导入</button></div>
<small id="status" role="status">正在读取 data/catalog.json…</small></div>
<div class="grid" id="grid"></div><div class="empty" id="empty" hidden>还没有商品。可以导入 Excel，或让 AI 上传 data/catalog.json。</div>
<div id="preview" role="dialog" aria-modal="true"><img id="large" alt="商品大图"><button id="close">关闭大图</button></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), key='picture-drawer-catalog-v1';
let rows=[],localRows=[];const fields={name:['名称','商品名称','产品名称','name','title','商品标题'],sku:['sku','SKU','货号','编号','产品编号'],category:['分类','品类','category'],stall:['档口','档口号','stall'],style:['风格','style'],date:['日期','上架日期','date'],note:['备注','描述','note'],image:['图片','图片链接','图片URL','image','image_url','url','主图']};
const cell=(r,aliases)=>{for(const k of aliases){const found=Object.keys(r).find(x=>x.trim().toLowerCase()===k.toLowerCase());if(found&&r[found]!==undefined&&r[found]!==null)return String(r[found]).trim()}return ''};
const normalize=r=>Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,cell(r,v)]));
const safeImage=u=>{try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return ''}};
const merged=()=>{const byKey=new Map();rows.concat(localRows).forEach((r,i)=>byKey.set(r.sku||r.name+'|'+r.stall||String(i),r));return [...byKey.values()]};
function render(){const data=merged();const prev={category:$('category').value,stall:$('stall').value};for(const k of ['category','stall']){const options=[...new Set(data.map(r=>r[k]).filter(Boolean))].sort();$(k).replaceChildren(new Option(k==='category'?'全部分类':'全部档口',''),...options.map(v=>new Option(v,v)));$(k).value=prev[k]}const q=$('q').value.toLowerCase();const out=data.filter(r=>(!q||[r.name,r.sku,r.stall,r.note,r.style].join(' ').toLowerCase().includes(q))&&(!$('category').value||r.category===$('category').value)&&(!$('stall').value||r.stall===$('stall').value));$('grid').replaceChildren();for(const r of out){const card=document.createElement('article');card.className='card';const im=document.createElement('img');im.loading='lazy';im.alt=r.name||r.sku||'商品';if(safeImage(r.image)){im.src=safeImage(r.image);im.addEventListener('click',()=>{$('large').src=im.src;$('preview').style.display='flex'})}else{im.alt='暂无有效图片链接';im.style.background='#352c3e'}const m=document.createElement('div');m.className='meta';const n=document.createElement('div');n.className='name';n.textContent=r.name||r.sku||'未命名';const t=document.createElement('div');t.className='tags';t.textContent=[r.sku,r.category,r.stall,r.style,r.note].filter(Boolean).join(' · ');m.append(n,t);card.append(im,m);$('grid').append(card)}$('empty').hidden=out.length>0;$('status').textContent='云端 '+rows.length+' 条 / 本机 '+localRows.length+' 条 / 当前 '+out.length+' 条（本机数据不会自动同步到其他设备）'}
async function load(){try{const res=await fetch('./data/catalog.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('暂无云端商品文件');const data=await res.json();if(!Array.isArray(data))throw Error('云端数据必须为 JSON 数组');rows=data.map(normalize).filter(r=>Object.values(r).some(Boolean))}catch(e){rows=[];$('status').textContent=e.message}render()}
$('openFile').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(typeof XLSX==='undefined')throw Error('Excel 解析库未加载，请联网后重试');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const items=[];for(const sh of wb.SheetNames)items.push(...XLSX.utils.sheet_to_json(wb.Sheets[sh],{defval:'',raw:false}));const clean=items.map(normalize).filter(r=>r.name||r.sku);if(!clean.length)throw Error('没有找到“名称”或“SKU”列');localRows=clean;try{localStorage.setItem(key,JSON.stringify(localRows))}catch{alert('本机存储空间不足，当前仍可浏览和导出 JSON')}render()}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(merged(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalog.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('clear').onclick=()=>{if(!confirm('仅清除本机 Excel 导入记录，云端数据不受影响。继续？'))return;localStorage.removeItem(key);localRows=[];render()};
$('refresh').onclick=load;$('q').oninput=render;$('category').onchange=render;$('stall').onchange=render;$('close').onclick=()=>{$('preview').style.display='none';$('large').removeAttribute('src')};$('preview').onclick=e=>{if(e.target===$('preview'))$('close').click()};
try{localRows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(localRows))localRows=[]}catch{localRows=[]}load();
})();
</script></body></html>
